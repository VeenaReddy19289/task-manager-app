<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Task Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:40px;

  overflow-x:hidden;

  position:relative;

  transition:0.4s;

  background:

  linear-gradient(
    rgba(255,255,255,0.15),
    rgba(255,255,255,0.15)
  ),

  url("https://images.unsplash.com/photo-1517842645767-c639042777db?q=80&w=2070&auto=format&fit=crop");

  background-size:cover;

  background-position:center;

  background-repeat:no-repeat;
}

/* LIGHT MODE */

.container{

  width:100%;

  max-width:860px;

  background:
  rgba(255,255,255,0.25);

  backdrop-filter:blur(22px);

  border-radius:34px;

  padding:40px;

  border:
  1px solid rgba(255,255,255,0.28);

  box-shadow:
  0 10px 40px rgba(0,0,0,0.10);

  position:relative;

  z-index:2;

  transition:0.4s;
}

.top{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:28px;
}

.logo{

  font-size:36px;

  font-weight:700;

  color:#1e293b;
}

.logo span{

  color:#2563eb;
}

.theme-btn{

  border:none;

  padding:12px 18px;

  border-radius:14px;

  background:
  linear-gradient(
    135deg,
    #2563eb,
    #4f46e5
  );

  color:white;

  cursor:pointer;

  font-weight:600;

  font-size:15px;

  transition:0.3s;
}

.theme-btn:hover{

  transform:translateY(-2px);
}

.search{

  width:100%;

  padding:18px;

  border:none;

  outline:none;

  border-radius:18px;

  margin-bottom:22px;

  font-size:16px;

  background:
  rgba(255,255,255,0.88);

  box-shadow:
  0 4px 14px rgba(0,0,0,0.06);
}

.input-box{

  display:flex;

  flex-direction:column;

  gap:16px;

  margin-bottom:28px;
}

.input-row{

  display:flex;

  gap:16px;
}

input,select{

  flex:1;

  padding:18px;

  border:none;

  outline:none;

  border-radius:18px;

  font-size:16px;

  background:
  rgba(255,255,255,0.88);

  box-shadow:
  0 4px 14px rgba(0,0,0,0.06);
}

.add-btn{

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #2563eb,
    #4f46e5
  );

  color:white;

  font-size:18px;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;
}

.add-btn:hover{

  transform:translateY(-3px);
}

ul{
  list-style:none;
}

li{

  background:
  rgba(255,255,255,0.35);

  backdrop-filter:blur(18px);

  border-radius:22px;

  padding:20px;

  margin-bottom:18px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  border:
  1px solid rgba(255,255,255,0.25);

  transition:0.3s;
}

.task-left{

  display:flex;

  gap:16px;

  align-items:flex-start;
}

.task-content h3{

  font-size:20px;

  color:#1e293b;

  font-weight:600;
}

.completed{

  text-decoration:line-through;

  opacity:0.55;
}

.time{

  font-size:13px;

  color:#475569;

  margin-top:6px;
}

.priority{

  display:inline-block;

  margin-top:10px;

  padding:6px 14px;

  border-radius:20px;

  font-size:12px;

  font-weight:600;

  color:white;
}

.high{
  background:#ef4444;
}

.medium{
  background:#f59e0b;
}

.low{
  background:#10b981;
}

.actions{

  display:flex;

  gap:10px;
}

.actions button{

  border:none;

  padding:11px 15px;

  border-radius:12px;

  cursor:pointer;

  font-weight:600;

  transition:0.3s;
}

.complete-btn{

  background:#dcfce7;

  color:#16a34a;
}

.edit-btn{

  background:#dbeafe;

  color:#2563eb;
}

.delete-btn{

  background:#fee2e2;

  color:#dc2626;
}

/* DARK MODE */

body.dark{

  background:

  linear-gradient(
    rgba(0,0,0,0.55),
    rgba(0,0,0,0.55)
  ),

  url("https://images.unsplash.com/photo-1517842645767-c639042777db?q=80&w=2070&auto=format&fit=crop");

  background-size:cover;

  background-position:center;
}

body.dark .container{

  background:
  rgba(15,23,42,0.55);

  border:
  1px solid rgba(255,255,255,0.08);
}

body.dark .logo{

  color:white;
}

body.dark .search,
body.dark input,
body.dark select{

  background:
  rgba(30,41,59,0.85);

  color:white;
}

body.dark li{

  background:
  rgba(30,41,59,0.65);
}

body.dark .task-content h3{

  color:white;
}

body.dark .time{

  color:#cbd5e1;
}

/* RESPONSIVE */

@media(max-width:768px){

  .input-row{

    flex-direction:column;
  }

  li{

    flex-direction:column;

    align-items:flex-start;

    gap:18px;
  }

  .actions{

    width:100%;
  }

  .actions button{

    flex:1;
  }
}

</style>

</head>

<body>

<div class="container">

  <div class="top">

    <div class="logo">
      ☁️ Task <span>Manager</span>
    </div>

    <button
      class="theme-btn"
      onclick="toggleTheme()"
    >
      🌙 Dark Mode
    </button>

  </div>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search tasks..."
    onkeyup="searchTasks()"
  >

  <div class="input-box">

    <div class="input-row">

      <input
        type="text"
        id="task"
        placeholder="Enter your task..."
      >

     <input
  type="date"
  id="date"
>


    </div>

    <div class="input-row">

      <select id="priority">

        <option value="high">
          High Priority
        </option>

        <option value="medium">
          Medium Priority
        </option>

        <option value="low">
          Low Priority
        </option>

      </select>

      <button
        class="add-btn"
        onclick="addTask()"
      >
        + Add Task
      </button>

    </div>

  </div>

  <ul id="list"></ul>

</div>

<script type="module">
import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";

import {

  getFirestore,
  addDoc,
  collection,
  getDocs,
  deleteDoc,
  doc,
  updateDoc

}

from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyApZuoNX7hegkgVAUOJ17KnFd2nKSUWGMs",

  authDomain: "task-manager-app-9cf70.firebaseapp.com",

  projectId: "task-manager-app-9cf70",

  storageBucket: "task-manager-app-9cf70.firebasestorage.app",

  messagingSenderId: "777416368486",

  appId: "1:777416368486:web:90247df3ef44bb173f28a7"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
if (Notification.permission !== "granted") {
  Notification.requestPermission();
}
console.log(Notification.permission);
async function addTask(){

  const task =
  document.getElementById("task").value;

  const date =
  document.getElementById("date").value;
  
  const dueTime =
  document.getElementById("time").value;

  const priority =
  document.getElementById("priority").value;

  if(task === "") return;

  const now = new Date();

  await addDoc(collection(db,"tasks"),{

  text: task,

  dueDate: date,

  dueTime: dueTime,

  priority: priority,

  completed:false,

  reminded:false,

  time: now.toLocaleString()

});

  document.getElementById("task").value="";

  loadTasks();
}

async function deleteTask(id){

  await deleteDoc(doc(db,"tasks",id));

  loadTasks();
}

async function completeTask(id,current){

  await updateDoc(doc(db,"tasks",id),{

    completed:!current

  });

  loadTasks();
}

async function editTask(id,oldText){

  const newText =
  prompt("Edit Task",oldText);

  if(newText){

    await updateDoc(doc(db,"tasks",id),{

      text:newText

    });

    loadTasks();
  }
}

async function loadTasks(){

  const querySnapshot =
  await getDocs(collection(db,"tasks"));

  const list =
  document.getElementById("list");

  list.innerHTML="";

  querySnapshot.forEach((d)=>{

    const data=d.data();

    const li=document.createElement("li");

    li.innerHTML=`

      <div class="task-left">

        <input
          type="checkbox"
          ${data.completed ? "checked" : ""}
          onclick="completeTask('${d.id}',${data.completed})"
        >

        <div class="task-content">

          <h3 class="${data.completed ? "completed" : ""}">
            ${data.text}
          </h3>

          <div class="time">
            🕒 ${data.time}
          </div>

          
          <div class="priority ${data.priority}">
            ${data.priority.toUpperCase()}
          </div>

        </div>

      </div>

      <div class="actions">

        <button
          class="complete-btn"
          onclick="completeTask('${d.id}',${data.completed})"
        >
          ✓
        </button>

        <button
          class="edit-btn"
          onclick="editTask('${d.id}','${data.text}')"
        >
          Edit
        </button>

        <button
          class="delete-btn"
          onclick="deleteTask('${d.id}')"
        >
          Delete
        </button>

      </div>

    `;

    list.appendChild(li);

  });

}
function searchTasks(){

  const input =
  document.getElementById("search")
  .value.toLowerCase();

  const tasks =
  document.querySelectorAll("li");

  tasks.forEach(task=>{

    const text =
    task.innerText.toLowerCase();

    task.style.display =
    text.includes(input)
    ? "flex"
    : "none";
  });
}

/* FIXED THEME FUNCTION */

window.toggleTheme = function(){

  document.body.classList.toggle("dark");
};

loadTasks();


window.addTask=addTask;

window.deleteTask=deleteTask;

window.completeTask=completeTask;

window.editTask=editTask;

window.searchTasks=searchTasks;

</script>

</body>
</html>
